<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch 004 — Superfici di servizio</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans); background: var(--color-void); color: var(--color-text);
    padding-top: 52px; -webkit-font-smoothing: antialiased;
  }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--color-bg), var(--ambient); }

  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    background: rgba(11,14,23,0.72); backdrop-filter: blur(var(--glass-blur-heavy));
    border-bottom: 1px solid var(--edge);
  }
  #variant-nav .label {
    font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-muted); margin-right: var(--space-2);
  }
  .variant-tab {
    font-family: inherit; font-size: var(--text-sm);
    padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
    border: 1px solid transparent; background: transparent; color: var(--color-text-dim);
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .variant-tab:hover { background: var(--glass-2); color: var(--color-text); }
  .variant-tab.active { background: var(--glass-3); color: var(--color-text); border-color: var(--edge-strong); }
  .variant { display: none; }
  .variant.active { display: block; }

  /* guscio dallo sketch 002 */
  .shell { display: flex; min-height: calc(100vh - 52px); }
  .sidebar {
    width: 232px; flex-shrink: 0; display: flex; flex-direction: column;
    padding: var(--space-5) var(--space-3);
    background: var(--glass-1); backdrop-filter: blur(var(--glass-blur));
    border-right: 1px solid var(--edge);
  }
  .brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3) var(--space-5); }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--radius-md);
    background: linear-gradient(140deg, var(--color-primary), #a05aff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: var(--text-sm); color: #04121c;
  }
  .brand-name { font-size: var(--text-sm); font-weight: 600; }
  .brand-sub { font-size: var(--text-2xs); color: var(--color-text-muted); }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-group + .nav-group { margin-top: var(--space-5); }
  .nav-label {
    font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-muted); padding: 0 var(--space-3) var(--space-2);
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
    font-size: var(--text-sm); color: var(--color-text-dim); cursor: pointer;
    border: 1px solid transparent; transition: all var(--dur-fast) var(--ease);
  }
  .nav-item:hover { background: var(--glass-2); color: var(--color-text); }
  .nav-item.active { background: var(--glass-3); color: var(--color-text); border-color: var(--edge-strong); }
  .nav-item .ico { width: 16px; text-align: center; opacity: 0.75; }
  .nav-item .count { margin-left: auto; font-size: var(--text-2xs); font-family: var(--font-mono); color: var(--color-text-muted); }
  .nav-item .count.warn { color: var(--color-warn); }

  .work { flex: 1; min-width: 0; padding: var(--space-6) var(--space-8) var(--space-12); }

  .page-head { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-5); }
  .page-head h1 { font-size: var(--text-2xl); font-weight: 600; letter-spacing: -0.02em; }
  .page-head p { color: var(--color-text-dim); font-size: var(--text-sm); margin-top: var(--space-2); max-width: 62ch; }
  .queue-meter { margin-left: auto; text-align: right; flex-shrink: 0; }
  .queue-meter .big { font-size: var(--text-2xl); font-weight: 650; font-variant-numeric: tabular-nums; }
  .queue-meter .lbl { font-size: var(--text-2xs); color: var(--color-text-muted); }

  .note {
    font-size: var(--text-xs); color: var(--color-text-muted);
    border-left: 2px solid var(--edge-strong); padding-left: var(--space-3);
    margin: var(--space-4) 0; line-height: 1.6;
  }
  .note b { color: var(--color-text-dim); }

  .poster {
    display: block; object-fit: cover; flex-shrink: 0;
    background: linear-gradient(160deg,#1b2033,#0d1019);
    border-radius: var(--radius-sm); border: 1px solid var(--edge);
  }
  .poster-empty { display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); font-size: var(--text-2xs); text-align: center; }

  .dir-clash { color: var(--color-danger); }

  .conf {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--text-2xs); font-family: var(--font-mono); color: var(--color-text-muted);
  }
  .conf-bar { width: 44px; height: 4px; border-radius: var(--radius-full); background: var(--glass-3); overflow: hidden; }
  .conf-bar i { display: block; height: 100%; background: var(--color-warn); }

  .btn {
    font-family: inherit; font-size: var(--text-sm);
    padding: 7px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--edge); background: var(--glass-2);
    color: var(--color-text-dim); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: all var(--dur-fast) var(--ease);
  }
  .btn:hover { background: var(--glass-3); color: var(--color-text); border-color: var(--edge-strong); }
  .btn-confirm { background: var(--color-owned-dim); border-color: rgba(61,220,151,0.4); color: var(--color-owned); }
  .btn-confirm:hover { background: rgba(61,220,151,0.22); color: var(--color-owned); }
  .btn-drop { color: var(--color-danger); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
  .btn-drop:hover { background: rgba(255,107,107,0.16); color: var(--color-danger); }
  .btn .k {
    font-family: var(--font-mono); font-size: 10px; opacity: 0.7;
    border: 1px solid currentColor; border-radius: 3px; padding: 0 3px;
  }

  /* ═══════════ A — stessa scheda della ricerca, azioni in linea ═══════════ */
  .cards { display: flex; flex-direction: column; gap: var(--space-3); }
  .card {
    display: flex; gap: var(--space-4); padding: var(--space-4);
    background: var(--glass-1); backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--edge); border-radius: var(--radius-lg);
    transition: all var(--dur) var(--ease);
  }
  .card:hover { background: var(--glass-2); border-color: var(--edge-strong); }
  .card .poster { width: 76px; height: 114px; }
  .card-main { flex: 1; min-width: 0; }
  .card-title { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.02em; }
  .card-dir { font-size: var(--text-sm); color: var(--color-text-dim); margin-top: 3px; }
  .match-line {
    display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
    margin-top: var(--space-3); font-size: var(--text-sm); color: var(--color-text-dim);
  }
  .match-line .arrow { color: var(--color-text-muted); }
  .match-line .proposed { color: var(--color-text); font-weight: 500; }
  .actions { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
  .actions input {
    flex: 1; min-width: 180px; padding: 7px 11px;
    background: var(--glass-2); border: 1px solid var(--edge); border-radius: var(--radius-md);
    color: var(--color-text); font-family: inherit; font-size: var(--text-sm); outline: none;
  }
  .actions input:focus { border-color: var(--color-primary); }

  /* ═══════════ B — coda di lavoro, confronto a due colonne ═══════════ */
  .queue { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--edge); border-radius: var(--radius-lg); overflow: hidden; }
  .qrow {
    display: grid; grid-template-columns: 1fr 22px 1fr auto;
    align-items: center; gap: var(--space-4);
    padding: var(--space-3) var(--space-4);
    background: var(--glass-1);
    cursor: pointer; transition: background var(--dur-fast) var(--ease);
  }
  .qrow:hover { background: var(--glass-2); }
  .qrow.sel { background: var(--color-primary-dim); box-shadow: inset 2px 0 0 var(--color-primary); }
  .qside { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .qside .poster { width: 30px; height: 45px; }
  .qtitle { font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qsub { font-size: var(--text-2xs); color: var(--color-text-muted); }
  .qarrow { text-align: center; color: var(--color-text-muted); font-size: var(--text-base); }
  .qacts { display: flex; align-items: center; gap: 6px; }
  .qacts .btn { padding: 5px 9px; font-size: var(--text-2xs); }
  .qbar {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3);
    background: var(--glass-1); border: 1px solid var(--edge); border-radius: var(--radius-md);
    font-size: var(--text-sm); color: var(--color-text-dim);
  }
  .qbar .kbd {
    font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-muted);
    border: 1px solid var(--edge); border-radius: var(--radius-sm); padding: 2px 6px;
  }

  /* ═══════════ C — una alla volta ═══════════ */
  .solo {
    max-width: 720px; margin: 0 auto;
    background: var(--glass-1); backdrop-filter: blur(var(--glass-blur-heavy));
    border: 1px solid var(--edge-strong); border-radius: var(--radius-xl);
    padding: var(--space-8); box-shadow: var(--shadow-lg);
  }
  .solo-progress {
    display: flex; align-items: center; gap: var(--space-3);
    font-size: var(--text-2xs); color: var(--color-text-muted); margin-bottom: var(--space-6);
  }
  .solo-progress .track { flex: 1; height: 3px; border-radius: var(--radius-full); background: var(--glass-3); overflow: hidden; }
  .solo-progress .track i { display: block; height: 100%; width: 5%; background: var(--color-primary); }
  .compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-5); align-items: center; }
  .compare .side { text-align: center; }
  .compare .side .poster { width: 128px; height: 192px; margin: 0 auto var(--space-3); }
  .compare .side h4 {
    font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-muted); font-weight: 600; margin-bottom: var(--space-3);
  }
  .compare .side .name { font-size: var(--text-base); font-weight: 500; line-height: 1.35; }
  .compare .side .meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 4px; }
  .compare .vs { color: var(--color-text-muted); font-size: var(--text-xl); }
  .solo-acts { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin-top: var(--space-8); }
  .solo-acts .btn { padding: 10px 18px; font-size: var(--text-base); }

  /* ─── striscia: le altre superfici ereditano lo stesso vocabolario ─── */
  .other-surfaces { margin-top: var(--space-12); }
  .other-surfaces h3 {
    font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-muted); margin-bottom: var(--space-3);
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-3); }
  .tile {
    padding: var(--space-4); border-radius: var(--radius-lg);
    background: var(--glass-1); border: 1px solid var(--edge);
    cursor: pointer; transition: all var(--dur) var(--ease);
  }
  .tile:hover { background: var(--glass-2); border-color: var(--edge-strong); transform: translateY(-1px); }
  .tile .n { font-size: var(--text-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .t { font-size: var(--text-sm); color: var(--color-text-dim); margin-top: 2px; }
  .tile .s { font-size: var(--text-2xs); color: var(--color-text-muted); margin-top: var(--space-2); }

  #sketch-tools {
    position: fixed; bottom: 12px; right: 12px; z-index: 9999;
    font-family: system-ui; font-size: 12px;
    background: rgba(0,0,0,0.78); backdrop-filter: blur(12px);
    color: #fff; padding: 10px 12px; border-radius: 10px;
    opacity: 0.35; transition: opacity 0.2s;
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools .tool-row { display: flex; align-items: center; gap: 6px; }
  #sketch-tools label { color: #999; font-size: 11px; min-width: 54px; }
  #sketch-tools select, #sketch-tools button {
    font-family: inherit; font-size: 11px;
    background: rgba(255,255,255,0.1); color: #fff;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 5px;
    padding: 3px 7px; cursor: pointer;
  }
  #sketch-tools button.on { background: var(--color-primary); color: #04121c; border-color: transparent; }
  body.no-glass *, body.no-glass *::before, body.no-glass *::after { backdrop-filter: none !important; }
  body.no-glass .card, body.no-glass .sidebar, body.no-glass .solo, body.no-glass .qrow { background: var(--color-bg-elevated); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    z-index: 9999; padding: var(--space-3) var(--space-5);
    background: rgba(17,21,36,0.92); backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--edge-strong); border-radius: var(--radius-full);
    font-size: var(--text-sm); box-shadow: var(--shadow-lg);
    opacity: 0; transition: all var(--dur) var(--ease);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="variant-nav">
  <span class="label">Sketch 004 · superfici di servizio</span>
  <button class="variant-tab active" onclick="showVariant('a', this)">A · Stessa scheda</button>
  <button class="variant-tab" onclick="showVariant('b', this)">B · Coda di lavoro ★</button>
  <button class="variant-tab" onclick="showVariant('c', this)">C · Una alla volta</button>
</div>

<div id="stages"></div>

<div id="sketch-tools">
  <div class="tool-row">
    <label>Tema</label>
    <select onchange="document.querySelector('link[href*=themes]').href='../themes/'+this.value+'.css'">
      <option value="default">default</option>
    </select>
  </div>
  <div class="tool-row"><label>Vetro</label><button class="on" onclick="toggleGlass(this)">acceso</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
const POSTER = 'https://image.tmdb.org/t/p/w185';

/* Abbinamenti incerti veri, presi dalla coda di produzione il 12/09/2026.
   Sono i peggiori otto per confidenza: è il materiale che la pagina deve far sbrigare. */
const QUEUE = [
  { t: '[CORTO] Violent People', d: 'Saviano', y: 2005, sec: 'Movie',
    m: 'I violenti', md: 'Rudolph Maté', my: 1956, p: '/kp9ZT7u53QktABohsPz7Yj4rvzL.jpg', c: 0.26 },
  { t: 'Caccia al serial killer', d: 'Azzopardi', y: 1998, sec: 'Movie',
    m: 'The Fall - Caccia al serial killer', md: 'serie · creata da Allan Cubitt', my: 2013, p: '/fm7nN3nUADA7JGgnFNlOWpXn1tf.jpg', c: 0.27 },
  { t: '[CORTO] Film', d: 'Schneider', y: 1964, sec: 'Movie',
    m: 'Film Theory', md: '—', my: null, p: '/eACzJr2wbR8xB57tPRnHGnxwlTH.jpg', c: 0.28 },
  { t: 'Afraid To Die', d: 'Yasuzo', y: 1960, sec: 'Movie',
    m: 'not afraid to die', md: 'Althea Thauberger', my: 2001, p: '/oqd8VyXVtuevkUvBTZdPMbz1Qju.jpg', c: 0.29 },
  { t: 'Due', d: 'Meneghetti', y: 2019, sec: 'Movie',
    m: 'It - Capitolo due', md: 'Andy Muschietti', my: 2019, p: '/g9ucHd1TgS2k3x0n9EVIaivzueN.jpg', c: 0.32 },
  { t: 'Fire Commando', d: 'Pallardy', y: 1984, sec: 'Movie',
    m: 'Fireback', md: 'Teddy Page', my: 1983, p: '/1twLKe1N5vLhMBTyCiw6cxQVtzt.jpg', c: 0.33 },
  { t: 'Don Camillo V - Il Compagno Don Camillo', d: 'Comencini', y: 1965, sec: 'Movie',
    m: 'Don Camillo', md: 'Julien Duvivier', my: 1952, p: '/yvOMeJ7O3ozJJUPiczcGH5MrFoB.jpg', c: 0.33 },
  { t: 'Christmas Story', d: 'Wuolijoki', y: 2007, sec: 'Movie',
    m: 'Una storia di Natale', md: 'Bob Clark', my: 1983, p: '/6slaGJd5geqKpAkWSB25BNq923F.jpg', c: 0.35 },
];

/* Cognome contro cognome: se i due registi non coincidono l'abbinamento è quasi
   sempre da buttare, ed è la cosa che si legge prima del titolo. */
function surname(name) {
  const parts = (name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[\s,·]+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '';
}
function dirMismatch(q) {
  if (!q.md || q.md === '—') return false;
  return surname(q.d) !== surname(q.md);
}

const NAV = `
  <div class="brand">
    <div class="brand-mark">DD</div>
    <div><div class="brand-name">DDUnlimited</div><div class="brand-sub">67.714 titoli</div></div>
  </div>
  <div class="nav-group">
    <div class="nav-item"><span class="ico">⌕</span> Ricerca</div>
    <div class="nav-item"><span class="ico">▦</span> Sezioni <span class="count">10</span></div>
    <div class="nav-item"><span class="ico">✦</span> Libreria Plex</div>
  </div>
  <div class="nav-group">
    <div class="nav-label">Manutenzione</div>
    <div class="nav-item active"><span class="ico">◎</span> Abbinamenti <span class="count warn">234</span></div>
    <div class="nav-item"><span class="ico">⚠</span> Dati mancanti <span class="count">16.862</span></div>
    <div class="nav-item"><span class="ico">⚙</span> Amministrazione</div>
    <div class="nav-item"><span class="ico">↗</span> Log su Grafana</div>
  </div>`;

const OTHER = `
  <div class="other-surfaces">
    <h3>Le altre superfici, con lo stesso vocabolario</h3>
    <div class="tiles">
      <div class="tile" onclick="showToast('Sezione Movie')">
        <div class="n">45.567</div><div class="t">Movie</div>
        <div class="s">12.880 in 1080p · 1.204 in 4K</div>
      </div>
      <div class="tile" onclick="showToast('Sezione Series')">
        <div class="n">15.008</div><div class="t">Series</div>
        <div class="s">Serie e miniserie</div>
      </div>
      <div class="tile" onclick="showToast('Dati mancanti')">
        <div class="n">16.862</div><div class="t">Senza regista o anno</div>
        <div class="s">Il titolo non segue lo schema atteso</div>
      </div>
      <div class="tile" onclick="showToast('Eliminati')">
        <div class="n">62</div><div class="t">Eliminati dal forum</div>
        <div class="s">Il post risponde 404</div>
      </div>
    </div>
  </div>`;

function head(extra) {
  return `
    <div class="page-head">
      <div>
        <h1>Abbinamenti da rivedere</h1>
        <p>TMDB ha proposto una scheda ma il punteggio è basso. Confermi, scarti o
           incolli la scheda giusta: finché resta qui, il voto non compare nella ricerca.</p>
      </div>
      <div class="queue-meter">
        <div class="big" style="color:var(--color-warn)">234</div>
        <div class="lbl">in coda</div>
      </div>
    </div>${extra}`;
}

function confHTML(c) {
  return `<span class="conf"><span class="conf-bar"><i style="width:${Math.round(c*100)}%"></i></span>${c.toFixed(2)}</span>`;
}

function renderA() {
  return `
    <div class="shell">
      <aside class="sidebar">${NAV}</aside>
      <main class="work">
        ${head(`<div class="note">
          La stessa scheda della ricerca, con le azioni sotto. <b>Coerenza massima</b>: chi sa
          usare la ricerca sa già usare questa pagina. Ma 234 elementi a questa altezza sono
          una giornata di scroll.
        </div>`)}
        <div class="cards">
          ${QUEUE.map((q, i) => `
            <div class="card" id="card-${i}">
              <img class="poster" src="${POSTER}${q.p}" alt="" loading="lazy">
              <div class="card-main">
                <div class="card-title">${q.t}</div>
                <div class="card-dir">${q.d}, ${q.y} · ${q.sec}</div>
                <div class="match-line">
                  <span>TMDB propone</span>
                  <span class="arrow">→</span>
                  <span class="proposed">${q.m}${q.my ? ' (' + q.my + ')' : ''}</span>
                  <span style="color:var(--color-text-muted)">regia di ${q.md}</span>
                  ${confHTML(q.c)}
                </div>
                <div class="actions">
                  <button class="btn btn-confirm" onclick="act(${i},'conferma')">✓ Conferma</button>
                  <button class="btn btn-drop" onclick="act(${i},'scarta')">Scarta</button>
                  <input placeholder="…oppure incolla la URL TMDB giusta">
                </div>
              </div>
            </div>`).join('')}
        </div>
        ${OTHER}
      </main>
    </div>`;
}

function renderB() {
  return `
    <div class="shell">
      <aside class="sidebar">${NAV}</aside>
      <main class="work">
        ${head(`<div class="note">
          Una riga per abbinamento, il titolo del forum a sinistra e la proposta TMDB a destra:
          <b>l'occhio confronta due colonne</b> invece di leggere una frase. Fatta per smaltire
          volume, con la tastiera: <span class="kbd">J</span> <span class="kbd">K</span> per
          muoversi, <span class="kbd">↵</span> conferma, <span class="kbd">⌫</span> scarta.
        </div>`)}
        <div class="qbar">
          <span>Tastiera:</span>
          <span class="kbd">J</span><span class="kbd">K</span> <span>muovi</span>
          <span class="kbd">↵</span> <span>conferma</span>
          <span class="kbd">⌫</span> <span>scarta</span>
          <span class="kbd">/</span> <span>cerca su TMDB</span>
          <span style="margin-left:auto;color:var(--color-text-muted)">8 di 234</span>
        </div>
        <div class="queue" id="queue">
          ${QUEUE.map((q, i) => `
            <div class="qrow ${i === 0 ? 'sel' : ''}" onclick="selectRow(${i})" id="qrow-${i}">
              <div class="qside">
                <div class="poster poster-empty" style="width:30px;height:45px">DD</div>
                <div style="min-width:0">
                  <div class="qtitle">${q.t}</div>
                  <div class="qsub"><span class="${dirMismatch(q) ? 'dir-clash' : ''}">${q.d}</span>, ${q.y}</div>
                </div>
              </div>
              <div class="qarrow">→</div>
              <div class="qside">
                <img class="poster" src="${POSTER}${q.p}" alt="" loading="lazy">
                <div style="min-width:0">
                  <div class="qtitle">${q.m} <span style="color:var(--color-text-muted)">${q.my || ''}</span></div>
                  <div class="qsub">
                    <span class="${dirMismatch(q) ? 'dir-clash' : ''}">${q.md}</span> · ${confHTML(q.c)}
                  </div>
                </div>
              </div>
              <div class="qacts">
                <button class="btn btn-confirm" onclick="act(${i},'conferma')">✓</button>
                <button class="btn btn-drop" onclick="act(${i},'scarta')">✕</button>
                <button class="btn" onclick="act(${i},'cerca')">cerca</button>
              </div>
            </div>`).join('')}
        </div>
        ${OTHER}
      </main>
    </div>`;
}

function renderC() {
  const q = QUEUE[0];
  return `
    <div class="shell">
      <aside class="sidebar">${NAV}</aside>
      <main class="work">
        ${head(`<div class="note">
          Un abbinamento alla volta, grande. <b>Nessuna scansione</b>: guardi due locandine e
          decidi. Perfetta per i casi difficili, lenta se ne vuoi sbrigare quaranta di fila —
          e i 234 in coda non si vedono mai tutti insieme.
        </div>`)}
        <div class="solo">
          <div class="solo-progress">
            <span>12 di 234</span>
            <span class="track"><i></i></span>
            <span>222 rimasti</span>
          </div>
          <div class="compare">
            <div class="side">
              <div class="poster poster-empty" style="width:128px;height:192px">NESSUNA<br>LOCANDINA</div>
              <h4>Sul forum</h4>
              <div class="name">${q.t}</div>
              <div class="meta">${q.d}, ${q.y} · ${q.sec}</div>
            </div>
            <div class="vs">→</div>
            <div class="side">
              <img class="poster" src="${POSTER}${q.p}" alt="">
              <h4>TMDB propone</h4>
              <div class="name">${q.m}</div>
              <div class="meta">${q.my || '—'} · regia di ${q.md}</div>
              <div class="meta">confidenza ${q.c.toFixed(2)}</div>
            </div>
          </div>
          <div class="solo-acts">
            <button class="btn btn-drop" onclick="act(0,'scarta')">Scarta <span class="k">⌫</span></button>
            <button class="btn" onclick="act(0,'cerca')">Cerca un'altra scheda <span class="k">/</span></button>
            <button class="btn btn-confirm" onclick="act(0,'conferma')">✓ È questo <span class="k">↵</span></button>
          </div>
        </div>
        ${OTHER}
      </main>
    </div>`;
}

document.getElementById('stages').innerHTML = `
  <div id="variant-a" class="variant active">${renderA()}</div>
  <div id="variant-b" class="variant">${renderB()}</div>
  <div id="variant-c" class="variant">${renderC()}</div>`;

let sel = 0;
function selectRow(i) {
  document.querySelectorAll('.qrow').forEach(r => r.classList.remove('sel'));
  const row = document.getElementById('qrow-' + i);
  if (row) { row.classList.add('sel'); sel = i; }
}
function act(i, what) {
  const q = QUEUE[i];
  showToast(`${what}: ${q.t} → ${q.m}`);
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('variant-b').classList.contains('active')) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { selectRow(Math.min(sel + 1, QUEUE.length - 1)); e.preventDefault(); }
  if (e.key === 'k' || e.key === 'ArrowUp') { selectRow(Math.max(sel - 1, 0)); e.preventDefault(); }
  if (e.key === 'Enter') { act(sel, 'conferma'); e.preventDefault(); }
  if (e.key === 'Backspace') { act(sel, 'scarta'); e.preventDefault(); }
});

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
function showVariant(id, btn) {
  document.querySelectorAll('.variant').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).classList.add('active');
  btn.classList.add('active');
}
function toggleGlass(btn) {
  const off = document.body.classList.toggle('no-glass');
  btn.textContent = off ? 'spento' : 'acceso';
  btn.classList.toggle('on', !off);
}
</script>
</body>
</html>
